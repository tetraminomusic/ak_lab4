[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Включены все правила, отключения ниже - только с обоснованием
select = ["ALL"]

ignore = [
    # Отчёт, комментарии и сообщения об ошибках на русском: кириллица
    # в тексте не является опечаткой
    "RUF001",
    "RUF002",
    "RUF003",

    # Учебный проект, лицензионная шапка в каждом файле не нужна
    "CPY001",

    # Докстринги у каждого модуля, класса и функции не требуются:
    # устройство процессора описано в README, а не продублировано в коде
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",

    # Взаимоисключающие правила оформления докстрингов, выбран второй вариант
    "D203",
    "D213",

    # Конфликтуют с ruff format, он сам расставляет запятые и переносы
    "COM812",
    "ISC001",

    # Длину строк держит ruff format. E501 остаётся ругаться только на
    # комментарии и строковые литералы, которые форматтер не переносит
    "E501",

    # Транслятор намеренно процедурный: таблица символов, счётчик регистров
    # и список команд живут в модульных переменных, а не в объекте-компиляторе
    "PLW0603",

    # Транслятор и симулятор - консольные утилиты, они обязаны печатать
    "T201",

    # Логирование одно на всю программу, своей иерархии логгеров нет
    "LOG015",

    # Сообщение об ошибке пишется прямо в raise: отдельный класс исключения
    # на каждую ошибку компиляции только раздул бы код
    "TRY003",
    "EM101",
    "EM102",

    # Модель процессора вся состоит из конкретных чисел: разрядности, маски,
    # коды ASCII, номера портов. Прятать каждое в константу вредно для чтения
    "PLR2004",

    # Декодер команд и АЛУ - это длинные цепочки if/elif по опкоду.
    # Так требует задание: прямой код вместо иерархии классов
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0915",

    # На верхнем уровне консольных утилит любая ошибка превращается
    # в сообщение пользователю, а не в трассировку
    "BLE001",

    # В лексере переменная token - это лексема, а не пароль
    "S105",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    # assert - основной инструмент pytest
    "S101",
    # Тесты не являются пакетом и не нуждаются в аннотациях типов
    "ANN",
    "INP001",
    # Путь к src добавляется через os.path, пока тесты не стали пакетом
    "PTH100",
    "PTH118",
    "PTH120",
]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
strict = true
