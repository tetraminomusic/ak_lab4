in_source: |-
  (progn
      (setq num 0)
      (setq ready 0)

      ; Число набирается из десятичных цифр до перевода строки
      (definterrupt isr ()
          (progn
              (setq ch (in 0))
              (if (= ch 10)
                  (setq ready 1)
                  (setq num (+ (* num 10) (- ch 48))))))

      (ei)

      (defun wait ()
          (if (= ready 1)
              0
              (wait)))

      (wait)
      (di)

      (defun print_num (n)
          (progn
              (if (> n 9)
                  (print_num (/ n 10))
                  0)
              (out 1 (+ 48 (% n 10)))))

      ; Длина последовательности Коллатца для num
      (defun collatz (n count)
          (if (= n 1)
              count
              (if (= (% n 2) 0)
                  (collatz (/ n 2) (+ count 1))
                  (collatz (+ (* 3 n) 1) (+ count 1)))))

      (print_num (collatz num 0))
  )

