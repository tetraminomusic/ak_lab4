in_source: |-
  (progn
      (setq num 0)
      (setq ready 0)
      (setq bad 0)

      ; Число набирается из десятичных цифр до перевода строки
      (definterrupt isr ()
          (progn
              (setq ch (in 0))
              (if (= ch 10)
                  (setq ready 1)
                  (progn
                      (setq digit (- ch 48))
                      (if (or bad (or (< digit 0) (> digit 9)))
                          (setq bad 1)
                          (if (or (> num 214748364)
                                  (and (= num 214748364) (> digit 7)))
                              (setq bad 1)
                              (setq num (+ (* num 10) digit))))))))

      (ei)

      (defun wait ()
          (if (= ready 1)
              0
              (wait)))

      (wait)
      (di)

      (defun print_num (n)
          (progn
              (if (> n 9)
                  (print_num (/ n 10))
                  0)
              (out 1 (+ 48 (% n 10)))))

      ; Два 32-битных слова для промежуточного значения. При умножении
      ; младшее слово разбиваем на половины, чтобы сохранить перенос.
      (defun collatz (hi lo count)
          (if (and (= hi 0) (= lo 1))
              count
              (if (= (and lo 1) 0)
                  (collatz (lsr hi 1)
                           (or (lsr lo 1) (lsl (and hi 1) 31))
                           (+ count 1))
                  (progn
                      (setq low_half (+ (* 3 (and lo 65535)) 1))
                      (setq high_half (+ (* 3 (lsr lo 16)) (lsr low_half 16)))
                      (setq carry (lsr high_half 16))
                      (if (or (< hi 0)
                              (or (> hi 1431655765)
                                  (and (= hi 1431655765) (> carry 0))))
                          -1
                          (collatz (+ (* 3 hi) carry)
                                   (or (lsl high_half 16) (and low_half 65535))
                                   (+ count 1)))))))

      (if (or bad (= num 0))
          (progn (out 1 45) (out 1 49))
          (progn
              (setq length (collatz 0 num 0))
              (if (< length 0)
                  (progn (out 1 45) (out 1 49))
                  (print_num length))))
  )

