in_source: |-
  (progn
      (setq x "                    ")
      (setq y "                    ")

      ; Массив заполняется вычислением, а не константами внутри кода
      (defun fill (i last)
          (if (> i last)
              0
              (progn
                  (aset x i (% (* i 7) 13))
                  (fill (+ i 1) last))))

      ; Скользящее окно из трёх элементов: соседние ячейки читаются
      ; повторно на каждом шаге, это и создаёт временную локальность
      (defun filter (i last)
          (if (> i last)
              0
              (progn
                  (aset y i (/ (+ (+ (aref x (- i 1)) (aref x i)) (aref x (+ i 1))) 3))
                  (filter (+ i 1) last))))

      (defun print_num (n)
          (progn
              (if (> n 9)
                  (print_num (/ n 10))
                  0)
              (out 1 (+ 48 (% n 10)))))

      (defun print_all (i last)
          (if (> i last)
              0
              (progn
                  (print_num (aref y i))
                  (out 1 32)
                  (print_all (+ i 1) last))))

      (fill 1 18)
      (filter 2 17)
      (print_all 2 17)
  )

