in_source: |-
  (progn
      (setq a "    ")
      (setq b "    ")
      (setq r "    ")

      ; Машинное слово 32 бита, поэтому 64-битное число держим
      ; четырьмя 16-битными разрядами, младший разряд первый
      (aset a 1 65535)
      (aset a 2 65535)
      (aset a 3 65535)
      (aset a 4 0)

      (aset b 1 1)
      (aset b 2 0)
      (aset b 3 0)
      (aset b 4 0)

      ; Сложение с ручным переносом между разрядами
      (defun add64 (i carry)
          (if (> i 4)
              carry
              (progn
                  (setq s (+ (+ (aref a i) (aref b i)) carry))
                  (aset r i (and s 65535))
                  (add64 (+ i 1) (lsr s 16)))))

      (defun hex_digit (d)
          (if (< d 10)
              (out 1 (+ 48 d))
              (out 1 (+ 55 d))))

      (defun print_limb (v shift)
          (if (< shift 0)
              0
              (progn
                  (hex_digit (and (lsr v shift) 15))
                  (print_limb v (- shift 4)))))

      (defun print_num64 (buf i)
          (if (< i 1)
              0
              (progn
                  (print_limb (aref buf i) 12)
                  (print_num64 buf (- i 1)))))

      (print_num64 a 4)
      (out 1 32)
      (out 1 43)
      (out 1 32)
      (print_num64 b 4)
      (out 1 32)
      (out 1 61)
      (out 1 32)

      (add64 1 0)
      (print_num64 r 4)
  )

