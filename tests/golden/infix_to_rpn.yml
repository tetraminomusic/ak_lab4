in_source: |-
  (progn
      (setq expr "                                ")
      (setq ops "                                ")
      (setq result "                                                                ")
      (setq idx 0)
      (setq top 0)
      (setq ready 0)
      (setq bad 0)
      (setq need_operand 1)
      (setq result_len 0)

      (definterrupt isr ()
          (progn
              (setq ch (in 0))
              (if (= ch 10)
                  (progn
                      (aset expr 0 idx)
                      (setq ready 1))
                  (if (< idx (aref expr 0))
                      (progn
                          (setq idx (+ idx 1))
                          (aset expr idx ch))
                      (setq bad 1)))))

      (ei)

      (defun wait ()
          (if (= ready 1)
              0
              (wait)))

      (wait)
      (di)

      ; Приоритет оператора, 0 означает что это не оператор
      (defun prec (c)
          (if (= c 42)
              2
              (if (= c 47)
                  2
                  (if (= c 43)
                      1
                      (if (= c 45)
                          1
                          0)))))

      (defun push_op (c)
          (progn
              (setq top (+ top 1))
              (aset ops top c)))

      (defun emit (c)
          (progn
              (setq result_len (+ result_len 1))
              (aset result result_len c)))

      (defun separator ()
          (if (> result_len 0) (emit 32) 0))

      (defun emit_op (c)
          (progn (separator) (emit c)))

      (defun digit (c)
          (and (>= c 48) (<= c 57)))

      (defun emit_num (i)
          (if (> i idx)
              i
              (if (digit (aref expr i))
                  (progn
                      (emit (aref expr i))
                      (emit_num (+ i 1)))
                  i)))

      ; Выталкиваем со стека операторы с приоритетом не ниже p
      (defun pop_while (p)
          (if (<= top 0)
              0
              (if (= (aref ops top) 40)
                  0
                  (if (< (prec (aref ops top)) p)
                      0
                      (progn
                          (emit_op (aref ops top))
                          (setq top (- top 1))
                          (pop_while p))))))

      ; Закрывающая скобка выталкивает всё до открывающей
      (defun pop_paren ()
          (if (<= top 0)
              (setq bad 1)
              (if (= (aref ops top) 40)
                  (setq top (- top 1))
                  (progn
                      (emit_op (aref ops top))
                      (setq top (- top 1))
                      (pop_paren)))))

      (defun flush ()
          (if (<= top 0)
              0
              (if (= (aref ops top) 40)
                  (setq bad 1)
                  (progn
                      (emit_op (aref ops top))
                      (setq top (- top 1))
                      (flush)))))

      ; Алгоритм сортировочной станции
      (defun after_operand (i c)
          (if (= c 41)
              (progn (pop_paren) (+ i 1))
              (if (> (prec c) 0)
                  (progn
                      (pop_while (prec c))
                      (push_op c)
                      (setq need_operand 1)
                      (+ i 1))
                  (setq bad 1))))

      (defun before_operand (i c)
          (if (= c 40)
              (progn (push_op c) (+ i 1))
              (if (digit c)
                  (progn
                      (separator)
                      (setq need_operand 0)
                      (emit_num i))
                  (setq bad 1))))

      (defun scan (i)
          (if (or bad (> i idx))
              0
              (progn
                  (setq cur (aref expr i))
                  (scan (if (or (= cur 32) (= cur 9))
                            (+ i 1)
                            (if need_operand
                                (before_operand i cur)
                                (after_operand i cur)))))))

      (defun print_result (i)
          (if (> i result_len)
              0
              (progn
                  (out 1 (aref result i))
                  (print_result (+ i 1)))))

      (scan 1)
      (flush)
      (if (or bad need_operand)
          (progn (out 1 45) (out 1 49))
          (print_result 1))
  )

in_schedule:
- [200, (]
- [900, '1']
- [1600, +]
- [2300, '2']
- [3000, )]
- [3700, '*']
- [4400, '3']
- [5100, "\n"]

