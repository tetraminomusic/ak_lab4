in_source: |-
  (progn
      (setq expr "                    ")
      (setq ops "                    ")
      (setq idx 0)
      (setq top 0)
      (setq ready 0)

      (definterrupt isr ()
          (progn
              (setq ch (in 0))
              (if (= ch 10)
                  (progn
                      (aset expr 0 idx)
                      (setq ready 1))
                  (progn
                      (setq idx (+ idx 1))
                      (aset expr idx ch)))))

      (ei)

      (defun wait ()
          (if (= ready 1)
              0
              (wait)))

      (wait)
      (di)

      ; Приоритет оператора, 0 означает что это операнд
      (defun prec (c)
          (if (= c 42)
              2
              (if (= c 47)
                  2
                  (if (= c 43)
                      1
                      (if (= c 45)
                          1
                          0)))))

      (defun push_op (c)
          (progn
              (setq top (+ top 1))
              (aset ops top c)))

      ; Выталкиваем со стека операторы с приоритетом не ниже p
      (defun pop_while (p)
          (if (<= top 0)
              0
              (if (= (aref ops top) 40)
                  0
                  (if (< (prec (aref ops top)) p)
                      0
                      (progn
                          (out 1 (aref ops top))
                          (setq top (- top 1))
                          (pop_while p))))))

      ; Закрывающая скобка выталкивает всё до открывающей
      (defun pop_paren ()
          (if (<= top 0)
              0
              (if (= (aref ops top) 40)
                  (setq top (- top 1))
                  (progn
                      (out 1 (aref ops top))
                      (setq top (- top 1))
                      (pop_paren)))))

      (defun flush ()
          (if (<= top 0)
              0
              (progn
                  (out 1 (aref ops top))
                  (setq top (- top 1))
                  (flush))))

      ; Алгоритм сортировочной станции
      (defun scan (i)
          (if (> i (aref expr 0))
              0
              (progn
                  (setq cur (aref expr i))
                  (if (= cur 40)
                      (push_op cur)
                      (if (= cur 41)
                          (pop_paren)
                          (if (= (prec cur) 0)
                              (out 1 cur)
                              (progn
                                  (pop_while (prec cur))
                                  (push_op cur)))))
                  (scan (+ i 1)))))

      (scan 1)
      (flush)
  )

in_schedule:
- [200, (]
- [900, '1']
- [1600, +]
- [2300, '2']
- [3000, )]
- [3700, '*']
- [4400, '3']
- [5100, "\n"]

