in_source: |-
  (progn
      (setq arr "            ")
      (setq idx 0)
      (setq ready 0)

      ; Список грузится как Pascal-строка: первое число - длина, дальше значения
      (definterrupt isr ()
          (progn
              (setq idx (+ idx 1))
              (aset arr idx (in 0))
              (if (> idx (aref arr 1))
                  (setq ready 1)
                  0)))

      (ei)

      (defun wait ()
          (if (= ready 1)
              0
              (wait)))

      (wait)
      (di)

      ; Печать числа в десятичном виде
      (defun print_num (n)
          (progn
              (if (> n 9)
                  (print_num (/ n 10))
                  0)
              (out 1 (+ 48 (% n 10)))))

      ; Один проход пузырьковой сортировки
      (defun pass (i last)
          (if (>= i last)
              0
              (progn
                  (if (> (aref arr i) (aref arr (+ i 1)))
                      (progn
                          (setq tmp (aref arr i))
                          (aset arr i (aref arr (+ i 1)))
                          (aset arr (+ i 1) tmp))
                      0)
                  (pass (+ i 1) last))))

      (defun bubble (k last)
          (if (<= k 0)
              0
              (progn
                  (pass 2 last)
                  (bubble (- k 1) last))))

      (defun print_all (i last)
          (if (> i last)
              0
              (progn
                  (print_num (aref arr i))
                  (out 1 32)
                  (print_all (+ i 1) last))))

      (setq n (aref arr 1))
      (bubble n (+ n 1))
      (print_all 2 (+ n 1))
  )

