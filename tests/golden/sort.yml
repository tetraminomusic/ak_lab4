in_source: |-
  (progn
      (setq arr "            ")
      (setq idx -1)
      (setq n 0)
      (setq ready 0)
      (setq bad 0)

      ; Список грузится как Pascal-строка: первое число - длина, дальше значения
      (definterrupt isr ()
          (progn
              (setq value (in 0))
              (if ready
                  0
                  (if (= idx -1)
                      (if (or (< value 0) (> value (aref arr 0)))
                          (progn (setq bad 1) (setq ready 1))
                          (progn
                              (setq n value)
                              (setq idx 0)
                              (setq ready (= n 0))))
                      (progn
                          (setq idx (+ idx 1))
                          (aset arr idx value)
                          (setq ready (= idx n)))))))

      (ei)

      (defun wait ()
          (if (= ready 1)
              0
              (wait)))

      (wait)
      (di)

      ; Печатаем модуль через неположительное число, чтобы не переполнить
      ; слово при выводе -2147483648.
      (defun print_digits (n)
          (progn
              (if (< n -9)
                  (print_digits (/ n 10))
                  0)
              (out 1 (- 48 (% n 10)))))

      (defun print_num (n)
          (if (< n 0)
              (progn (out 1 45) (print_digits n))
              (print_digits (- 0 n))))

      ; Один проход пузырьковой сортировки
      (defun pass (i last)
          (if (>= i last)
              0
              (progn
                  (if (> (aref arr i) (aref arr (+ i 1)))
                      (progn
                          (setq tmp (aref arr i))
                          (aset arr i (aref arr (+ i 1)))
                          (aset arr (+ i 1) tmp))
                      0)
                  (pass (+ i 1) last))))

      (defun bubble (last)
          (if (<= last 1)
              0
              (progn
                  (pass 1 last)
                  (bubble (- last 1)))))

      (defun print_all (i last)
          (if (> i last)
              0
              (progn
                  (print_num (aref arr i))
                  (if (< i last) (out 1 32) 0)
                  (print_all (+ i 1) last))))

      (if bad
          (progn (out 1 45) (out 1 49))
          (progn
              (bubble n)
              (print_all 1 n)))
  )

