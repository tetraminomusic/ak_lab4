in_source: |-
  (progn
      (setq yes "True")
      (setq no "False")

      (defun print_str (s i)
          (if (> i (aref s 0))
              0
              (progn
                  (out 1 (aref s i))
                  (print_str s (+ i 1)))))

      ; Присваивание - выражение, его значение можно сразу напечатать
      (print (setq ch 65))
      (out 1 10)

      ; Ветвление - выражение, его значение можно присвоить
      (setq n (if (= ch 65) 66 67))
      (out 1 n)
      (out 1 10)

      ; Сравнение - тоже выражение, оно даёт 1 или 0
      (out 1 (+ 48 (= ch 65)))
      (out 1 (+ 48 (< 9 2)))
      (out 1 10)

      ; Ветвление возвращает указатель на строку, печатаем её функцией на языке
      (print_str (if (= ch 65) yes no) 1)
      (out 1 10)

      ; DI даёт 0 напрямую и внутри выбранной ветви; другая ветвь даёт 66
      (out 1 (+ 48 (di)))
      (out 1 (+ 48 (if (= ch 65) (progn (di)) 17)))
      (out 1 (if (= ch 65) 66 (di)))

      ; Перевод строки хранится в данных и экранируется в листинге
      (out 1 (aref "X
  Y" 3))
  )

