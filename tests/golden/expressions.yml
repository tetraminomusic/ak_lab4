in_source: |-
  (progn
      (setq yes "True")
      (setq no "False")

      (defun print_str (s i)
          (if (> i (aref s 0))
              0
              (progn
                  (out 1 (aref s i))
                  (print_str s (+ i 1)))))

      ; Присваивание - выражение, его значение можно сразу напечатать
      (print (setq ch 65))
      (out 1 10)

      ; Ветвление - выражение, его значение можно присвоить
      (setq n (if (= ch 65) 66 67))
      (out 1 n)
      (out 1 10)

      ; Сравнение - тоже выражение, оно даёт 1 или 0
      (out 1 (+ 48 (= ch 65)))
      (out 1 (+ 48 (< 9 2)))
      (out 1 10)

      ; Ветвление возвращает указатель на строку, печатаем её функцией на языке
      (print_str (if (= ch 65) yes no) 1)
  )

