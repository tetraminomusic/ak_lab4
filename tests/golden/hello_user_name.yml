in_source: |-
  (progn
      (setq prompt "What is your name?")
      (setq greet "Hello, ")
      (setq name "            ")

      (setq idx 0)
      (setq ready 0)

      (defun print_str (s i)
          (if (> i (aref s 0))
              0
              (progn
                  (out 1 (aref s i))
                  (print_str s (+ i 1)))))

      ; Имя приходит по прерываниям и копится в буфере до перевода строки
      (definterrupt isr ()
          (progn
              (setq ch (in 0))
              (if (= ch 10)
                  (progn
                      (aset name 0 idx)
                      (setq ready 1))
                  (if (and (= ready 0) (< idx (aref name 0)))
                      (progn
                          (setq idx (+ idx 1))
                          (aset name idx ch))
                      0))))

      (ei)

      (print_str prompt 1)
      (out 1 10)

      (defun wait ()
          (if (= ready 1)
              0
              (wait)))

      (wait)
      (di)

      (print_str greet 1)
      (print_str name 1)
      (out 1 33)
  )

in_schedule:
- [200, A]
- [800, l]
- [1400, i]
- [2000, c]
- [2600, e]
- [3200, "\n"]

