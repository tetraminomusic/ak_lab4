  0008 - 0x12000020 - JMP 32  ; (definterrupt isr () (out 1 (in 0)))
  0012 - 0x19100000 - PUSH R1  ; (definterrupt isr () (out 1 (in 0)))
  0016 - 0x1B100000 - IN R1, 0  ; (in 0)
  0020 - 0x1C100001 - OUT 1, R1  ; (out 1 (in 0))
  0024 - 0x1A100000 - POP R1  ; (definterrupt isr () (out 1 (in 0)))
  0028 - 0x1F000000 - IRET  ; (definterrupt isr () (out 1 (in 0)))
  0032 - 0x1D000000 - EI  ; (ei)
  0036 - 0x12000030 - JMP 48  ; (defun wait () (wait))
  0040 - 0x12000028 - JMP 40  ; (defun wait () (wait))
  0044 - 0x18000000 - RET  ; (defun wait () (wait))
  0048 - 0x17000028 - CALL 40  ; (wait)
  0052 - 0x04110000 - ADD R1, R1, R0  ; (wait)
  0056 - 0x20000000 - HLT

out_stdout: ABDE

