in_source: |-
  (progn
      ; D приходит до IN и затирает C. E приходит после IN, но до IRET:
      ; следующий обработчик получит его после восстановления контекста.
      (definterrupt isr ()
          (out 1 (in 0)))

      (ei)

      ; Фоновый цикл ожидания
      (defun wait ()
          (wait))

      (wait)
  )

in_schedule:
- [100, A]
- [200, B]
- [500, C]
- [530, D]
- [545, E]
- [900, F]

in_ticks: 1100

