in_source: |-
  (progn
      ; Обработчик занимает заметное время, поэтому при плотном вводе
      ; следующий символ приходит прямо во время обработки предыдущего
      (definterrupt isr ()
          (out 1 (in 0)))

      (ei)

      ; Фоновый цикл ожидания
      (defun wait ()
          (wait))

      (wait)
  )

in_schedule:
- [100, A]
- [200, B]
- [500, C]
- [540, D]
- [900, E]

in_ticks: 1100

out_code_hex: |-
  0000 - 0x12000008 - JMP 8
  0004 - 0x1200000C - JMP 12
  0008 - 0x12000020 - JMP 32
  0012 - 0x19100000 - PUSH R1
  0016 - 0x1B100000 - IN R1, 0
  0020 - 0x1C100001 - OUT 1, R1
  0024 - 0x1A100000 - POP R1
  0028 - 0x1F000000 - IRET
  0032 - 0x1D000000 - EI
  0036 - 0x12000030 - JMP 48
  0040 - 0x12000028 - JMP 40
  0044 - 0x18000000 - RET
  0048 - 0x17000028 - CALL 40
  0052 - 0x04110000 - ADD R1, R1, R0
  0056 - 0x20000000 - HLT

out_stdout: ABDE

