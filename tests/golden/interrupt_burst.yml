in_source: |-
  (progn
      ; Обработчик занимает заметное время, поэтому при плотном вводе
      ; следующий символ приходит прямо во время обработки предыдущего
      (definterrupt isr ()
          (out 1 (in 0)))

      (ei)

      ; Фоновый цикл ожидания
      (defun wait ()
          (wait))

      (wait)
  )

in_schedule:
- [100, A]
- [200, B]
- [500, C]
- [540, D]
- [900, E]

in_ticks: 1100

out_code_hex: |-
  0000 - 0x12000002 - JMP 2
  0001 - 0x12000003 - JMP 3
  0002 - 0x12000008 - JMP 8
  0003 - 0x19100000 - PUSH R1
  0004 - 0x1B100000 - IN R1, 0
  0005 - 0x1C100001 - OUT 1, R1
  0006 - 0x1A100000 - POP R1
  0007 - 0x1F000000 - IRET
  0008 - 0x1D000000 - EI
  0009 - 0x1200000C - JMP 12
  0010 - 0x1200000A - JMP 10
  0011 - 0x18000000 - RET
  0012 - 0x1700000A - CALL 10
  0013 - 0x04110000 - ADD R1, R1, R0
  0014 - 0x20000000 - HLT

out_stdout: ABDE

