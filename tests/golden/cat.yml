in_source: |-
  (progn
      ; Обработчик прерывания (trap): пришел символ -> напечатали обратно
      (definterrupt isr ()
          (out 1 (in 0)))

      (ei)

      ; Фоновый цикл ожидания
      (defun wait ()
          (wait))

      (wait)
  )

in_schedule:
- [100, P]
- [200, i]
- [300, n]
- [400, g]

in_ticks: 800

