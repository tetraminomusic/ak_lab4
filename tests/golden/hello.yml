in_source: |-
  (progn
      ; Строка лежит в статической памяти как Pascal-строка
      (setq msg "Hello, World!")

      ; Печать строки - функция на самом языке, а не набор констант в коде
      (defun print_str (s i)
          (if (> i (aref s 0))
              0
              (progn
                  (out 1 (aref s i))
                  (print_str s (+ i 1)))))

      (print_str msg 1)
  )

